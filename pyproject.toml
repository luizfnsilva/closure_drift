[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "closure-drift"
dynamic = ["version"]
description = "Does your version label name exactly one version of your code? A read-only, zero-dependency check over any git repository."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Luiz F. Nunes da Silva", email = "lfnsilva.invest@gmail.com"}]
keywords = ["versioning", "release", "reproducibility", "provenance", "git", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/luizfnsilva/closure_drift"
Changelog = "https://github.com/luizfnsilva/closure_drift/blob/main/CHANGELOG.md"
Issues = "https://github.com/luizfnsilva/closure_drift/issues"
DOI = "https://doi.org/10.5281/zenodo.21763931"

[project.scripts]
closure-drift = "closure_drift:main"

[tool.setuptools]
py-modules = ["closure_drift"]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
