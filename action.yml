name: "closure_drift: version label gate"
description: "Fail a release when its version label already names different code. Read-only, zero dependencies."
author: "Luiz F. Nunes da Silva"
branding:
  icon: "tag"
  color: "gray-dark"

inputs:
  mode:
    description: "'would-tag' (default): would tagging this commit reuse a label that already names other code? 'measure': measure the whole tag history."
    required: false
    default: "would-tag"
  path:
    description: "Path of the repository to measure."
    required: false
    default: "."
  args:
    description: "Extra arguments, e.g. --tags 'v*' --strict --closure 'src/**'."
    required: false
    default: ""
  allow-undetermined:
    description: "'true' lets the step pass when nothing could be determined (exit 2). Default: fail, because an absence of measurement is not a pass."
    required: false
    default: "false"

outputs:
  verdict:
    description: "The verdict in the report."
    value: ${{ steps.run.outputs.verdict }}
  exit-code:
    description: "0 clean, 1 drift, 2 no determination."
    value: ${{ steps.run.outputs.code }}

runs:
  using: "composite"
  steps:
    - id: run
      shell: bash
      env:
        CD_MODE: ${{ inputs.mode }}
        CD_PATH: ${{ inputs.path }}
        CD_ARGS: ${{ inputs.args }}
        CD_ALLOW: ${{ inputs.allow-undetermined }}
        CD_HOME: ${{ github.action_path }}
      run: |
        case "$CD_MODE" in
          would-tag) mode="--would-tag" ;;
          measure)   mode="" ;;
          *) echo "::error::closure_drift: mode must be 'would-tag' or 'measure'"; exit 2 ;;
        esac
        PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
        # The tags are the publication points. A shallow checkout has none of them.
        if [ "$(git -C "$CD_PATH" rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
          echo "::error::closure_drift needs the tags: use actions/checkout with fetch-depth: 0"
          exit 2
        fi
        set +e
        # shellcheck disable=SC2086
        "$PY" "$CD_HOME/closure_drift.py" "$CD_PATH" $mode $CD_ARGS --json > "$RUNNER_TEMP/closure-drift.json"
        code=$?
        "$PY" "$CD_HOME/closure_drift.py" "$CD_PATH" $mode $CD_ARGS
        set -e
        verdict=$("$PY" -c "import json,sys; print(json.load(open(sys.argv[1])).get('verdict','refused'))" "$RUNNER_TEMP/closure-drift.json" 2>/dev/null || echo refused)
        # Annotations are a presentation of the report, built from its fields; the logic is the detector's.
        "$PY" - "$RUNNER_TEMP/closure-drift.json" <<'PY' || true
        import json, sys
        try:
            r = json.load(open(sys.argv[1]))
        except Exception:
            sys.exit(0)
        clean = lambda t: str(t).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace("::", ": :")
        v = r.get("verdict")
        if v == "would_drift":
            print("::error title=closure_drift: this version already names other code::The label %s at this commit "
                  "is already declared, with different code, at: %s. Change the version before tagging."
                  % (clean(r.get("label_at_head")), clean("; ".join(r.get("collides_with", [])[:5]))))
        elif v == "drift":
            for label, states in list(r.get("drift", {}).items())[:10]:
                print("::error title=closure_drift: one label, more than one closure::The label %s names %d "
                      "different closures: %s" % (clean(label), len(states), clean("; ".join(states.values()))))
        elif v not in ("clean", "would_be_clean"):
            print("::warning title=closure_drift: nothing was determined::verdict %s" % clean(v))
        import os
        summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary:
            cell = lambda t: str(t).replace("|", "\\|").replace("\n", " ").replace("<", "&lt;")
            rows = [("verdict", "**%s**" % cell(v)),
                    ("measured at", cell(r.get("stamp", {}).get("measured_at_head", ""))),
                    ("detector", cell(r.get("stamp", {}).get("detector_closure", "")))]
            for key in ("label_at_head", "labels", "labels_covering_multiple_closures",
                        "publication_points_scanned", "publication_points_compared", "points_without_label"):
                if key in r:
                    rows.append((key.replace("_", " "), cell(r[key])))
            with open(summary, "a", encoding="utf-8") as fh:
                fh.write("### closure_drift\n\n| | |\n|---|---|\n")
                fh.write("".join("| %s | %s |\n" % row for row in rows))
        PY
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" = "2" ] && [ "$CD_ALLOW" = "true" ]; then
          echo "::notice::closure_drift: nothing could be determined ($verdict); allowed by allow-undetermined"
          exit 0
        fi
        exit "$code"
