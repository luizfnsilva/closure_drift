# The MCP server image on ghcr.io, for the MCP Registry. On a release tag, or by hand.
name: mcp-image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: integrations/mcp/Dockerfile
          push: true
          tags: ghcr.io/luizfnsilva/closure_drift:${{ steps.v.outputs.version }}
      - name: the server answers inside the image
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm ghcr.io/luizfnsilva/closure_drift:${{ steps.v.outputs.version }} | tee out.txt
          grep -q '"would_tag"' out.txt
