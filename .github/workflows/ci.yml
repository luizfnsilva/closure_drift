name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Monthly, so that a break caused by something outside this repository is found by the
    # author rather than by the first person who tries to use the tool.
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  version:
    # The 0.7.0 tag was pushed with VERSION at 0.7.0 and CITATION.cff at 0.6.0, and every job here
    # was green. A version label naming two states is the defect this tool measures; this step is
    # the one that would have stopped it.
    name: the version label names one state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Files agree, and on a tag push the tag agrees with them
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python3 tools/conferir_versao.py --tag "${GITHUB_REF_NAME}"
          else
            python3 tools/conferir_versao.py
          fi

  deposit:
    # Offline: the nine files against the manifest that ships with them. This does NOT establish
    # that they match the published record — a package cannot establish its own provenance. The
    # comparison against Zenodo is the `record` job below.
    name: the nine files match DEPOSIT.sha256
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the nine deposited files against DEPOSIT.sha256
        run: python3 tools/verify_deposit.py
      - name: The report examples in docs/ are what the detector prints
        run: python3 tools/make_report_examples.py --check
      - name: The demonstrations in docs/ are what the detector prints
        run: python3 tools/make_demos.py --check

  record:
    # Against the published record, which is outside this package. Scheduled and manual only: a pull
    # request must not fail because Zenodo is unreachable, and a release is not yet deposited when
    # its tag is pushed.
    name: the nine files match the published record
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-fetch the deposit named in DEPOSIT.sha256 and compare
        run: python3 tools/verify_deposit.py --from-zenodo

  test:
    name: batteries · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  python: '3.9'}
          - {os: ubuntu-latest,  python: '3.11'}
          - {os: ubuntu-latest,  python: '3.13'}
          - {os: macos-latest,   python: '3.11'}
          - {os: macos-latest,   python: '3.13'}
          - {os: windows-latest, python: '3.9'}
          - {os: windows-latest, python: '3.13'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Three batteries, each with its own polarity and its own pre-registration
      # (tests/PREREGISTRATION.md, tests/PREREGISTRATION_ADVERSARIAL.md). Their scores are
      # printed side by side and never added together.
      - name: Demonstration — the three answers
        run: python examples/demo.py
      - name: Negative fixture — a label-only corpus must be flagged
        run: python tests/fixture_label_only.py
      - name: Acceptance battery — the pre-registered proofs
        run: python tests/battery.py
      - name: Negative controls — the battery must go red on a broken detector
        run: python tests/negative_controls.py
      - name: Adversarial campaign — hostile repositories and hostile input
        run: python tests/adversarial.py

  self:
    name: measure this repository with itself
    runs-on: ubuntu-latest
    needs: [version, deposit, test]
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are the publication points declared in .closure-drift.json.
          fetch-depth: 0
      - name: Run closure_drift on closure_drift
        run: |
          set +e
          python3 closure_drift.py --json > self-measurement.json
          status=$?
          set -e
          cat self-measurement.json
          case "$status" in
            0) echo "::notice::no label at a tag covers more than one closure (the report carries the verdict)" ;;
            1) echo "::error::drift — a label at a tag covers more than one closure"; exit 1 ;;
            2) echo "::notice::not determinable yet (no tags, or no label found)" ;;
            *) echo "::error::unexpected exit code $status"; exit "$status" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: self-measurement
          path: self-measurement.json
          if-no-files-found: error
