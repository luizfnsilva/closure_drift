name: publish

# Uploads a tagged release to PyPI. No token is stored anywhere:
# PyPI trusts this workflow of this repository ("trusted publishing"), configured once on pypi.org.
# Run by hand once the project is registered on PyPI as a trusted publisher for this workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the release tag to publish, e.g. v0.9.0"
        required: true

permissions:
  contents: read

jobs:
  pypi:
    name: build and upload to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The version label names one state, and the tag agrees with it
        env:
          TAG: ${{ inputs.tag }}
        run: python tools/conferir_versao.py --tag "$TAG"
      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build
      - name: The built module is the deposited module, byte for byte
        run: |
          python - <<'PY'
          import hashlib, sys, zipfile, glob
          want = hashlib.sha256(open("closure_drift.py", "rb").read()).hexdigest()
          wheel = glob.glob("dist/*.whl")[0]
          got = hashlib.sha256(zipfile.ZipFile(wheel).read("closure_drift.py")).hexdigest()
          print(want, "repository"); print(got, "wheel")
          sys.exit(0 if want == got else 1)
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
