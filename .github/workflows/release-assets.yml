name: release-assets

# §34 R18-10: the release's wheel and sdist are built here, from the tag, not on a laptop.
# The rite creates the release as a draft, runs this, checks the result, and only then publishes it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the release tag, e.g. v1.8.2 (its release must exist as a draft; dispatch with --ref set to the same tag)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # upload to the draft release
      id-token: write        # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The workflow runs from the tag, so the provenance names it
        # 1.8.1 was dispatched from main: its provenance named refs/heads/main, not the tag.
        # Dispatch with: gh workflow run release-assets.yml --ref vX -f tag=vX
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "refusing: running from $GITHUB_REF; dispatch with --ref $TAG"; exit 1
          fi
      - name: The version label names one state, and the tag agrees with it
        env:
          TAG: ${{ inputs.tag }}
        run: python tools/conferir_versao.py --tag "$TAG"
      - name: Build from the tag, with pinned tools, twice
        # The tools are pinned and the build runs without isolation, so the backend that builds
        # is the one named here, and BUILD-ENV records it next to the artifacts. The sdist is
        # normalized (tools/normalize_sdist.py): setuptools writes the builder's uid, name and
        # mtimes into it. A second build in a fresh copy must give the same two sha256.
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m pip install --quiet "build==1.6.1" "setuptools==84.2.1"
          python -m build --no-isolation
          python tools/normalize_sdist.py dist/*.tar.gz
          git worktree add -q ../second HEAD
          (cd ../second && python -m build --no-isolation --outdir dist && python tools/normalize_sdist.py dist/*.tar.gz)
          (cd dist && sha256sum *.whl *.tar.gz) > first.txt
          (cd ../second/dist && sha256sum *.whl *.tar.gz) > second.txt
          cat first.txt
          diff first.txt second.txt
          {
            echo "python $(python -c 'import platform; print(platform.python_version())')"
            python -m pip --version | cut -d' ' -f1,2
            python -m pip show build setuptools wheel 2>/dev/null | grep -E '^(Name|Version):' | paste - -
            echo "SOURCE_DATE_EPOCH $SOURCE_DATE_EPOCH"
            echo "commit $(git rev-parse HEAD)"
          } > dist/BUILD-ENV
          cat dist/BUILD-ENV
      - name: The built module is the tag's module, byte for byte
        run: |
          python - <<'PY'
          import glob, hashlib, sys, zipfile
          want = hashlib.sha256(open("closure_drift.py", "rb").read()).hexdigest()
          got = hashlib.sha256(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).read("closure_drift.py")).hexdigest()
          print(want, "tag"); print(got, "wheel")
          sys.exit(0 if want == got else 1)
          PY
      - name: Checksums
        # DEPOSIT.sha256 (the Zenodo manifest, as in the tag) goes with the release, so its nine
        # hash lines have an attested digest. The deposited copy differs only in the DOI line.
        run: cp DEPOSIT.sha256 dist/ && cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz, dist/BUILD-ENV, dist/DEPOSIT.sha256"
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/BUILD-ENV dist/DEPOSIT.sha256 dist/SHA256SUMS --clobber
