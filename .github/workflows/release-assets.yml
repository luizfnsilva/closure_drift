name: release-assets

# §34 R18-10: the release's wheel and sdist are built here, from the tag, not on a laptop.
# The rite creates the release as a draft, runs this, checks the result, and only then publishes it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the release tag, e.g. v1.8.0 (its release must exist as a draft)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # upload to the draft release
      id-token: write        # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The version label names one state, and the tag agrees with it
        env:
          TAG: ${{ inputs.tag }}
        run: python tools/conferir_versao.py --tag "$TAG"
      - name: Build from the tag
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m pip install --quiet build
          python -m build
      - name: The built module is the tag's module, byte for byte
        run: |
          python - <<'PY'
          import glob, hashlib, sys, zipfile
          want = hashlib.sha256(open("closure_drift.py", "rb").read()).hexdigest()
          got = hashlib.sha256(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).read("closure_drift.py")).hexdigest()
          print(want, "tag"); print(got, "wheel")
          sys.exit(0 if want == got else 1)
          PY
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
